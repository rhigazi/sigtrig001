name: Alpaca Market Monitor

on:
  schedule:
    # Runs the script during US Regular Trading Hours (RTH) every 15 minutes with a shifted offset (7, 22, 37, 52)
    # This avoids global peak times on GitHub Actions, preventing delayed execution or missed runs.
    # US RTH is 09:30 to 16:00 US Eastern Time (ET)
    # - Während der Sommerzeit (EDT, UTC-4): 13:30 bis 20:00 Uhr UTC (15:30 bis 22:00 Uhr deutscher Zeit)
    # - Während der Winterzeit (EST, UTC-5): 14:30 bis 21:00 Uhr UTC (15:30 bis 22:00 Uhr deutscher Zeit)
    # This cron runs from 13:00 to 21:00 UTC Monday-Friday, covering all RTH periods year-round.
    - cron: '7,22,37,52 13-21 * * 1-5'
  workflow_dispatch: # Allows manual testing and external webhook triggers in the GitHub UI

permissions:
  contents: write

jobs:
  check-limits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monitoring Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # You can configure COOLDOWN_HOURS and BYPASS_MARKET_OPEN_CHECK here if desired.
          # BYPASS_MARKET_OPEN_CHECK: 'False'
          # COOLDOWN_HOURS: '2.0'
        run: python monitor.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add config.csv
          if git diff --cached --quiet; then
            echo "No changes to config.csv to commit."
          else
            git commit -m "Auto-update config.csv with latest market prices & trigger timestamps [skip ci]"
            git push
          fi
